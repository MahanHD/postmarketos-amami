%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  # The stock firmware's colour matrix (SOI20BS0/color_ctrl.dat, Q10), which it
  # uses at every colour temperature. Left off: on this CPU the matrix path of
  # the soft ISP runs at a third of the speed (11 against 33 fps at 1080p).
  # - Ccm:
  #     ccms:
  #       - ct: 5000
  #         ccm: [ 1.3545, -0.4512,  0.0967,
  #               -0.1777,  1.2979, -0.1201,
  #                0.0342, -0.3740,  1.3398 ]
  - Adjust:
  - Agc:
  # Contrast autofocus over the range the module's EEPROM gives for infinity
  # and macro (0xd0 in the EEPROM: 326 and 681 on the unit this was tuned on).
  - Af:
      infinity: 326
      macro: 681
      step: 32
...
